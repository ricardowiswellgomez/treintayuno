name: Build treseiscinco

on:
  push:
    branches: [main]
    # Updating only the already-built APK must not trigger another Android build.
    paths-ignore:
      - "public/treseiscinco.apk"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check Cloudflare Worker syntax
        run: node --check src/worker.js
      - name: Test startup recovery and clean URLs
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build installable Android APK
        run: |
          # Avoid packaging a previously published APK inside the next APK.
          rm -f dist/treseiscinco.apk
          npx cap add android
          # Use the official 365 app-icon artwork and generate every launcher density before syncing.
          mkdir -p assets
          cp public/icon-treseiscinco-512.svg assets/logo.svg
          npm run android:icons
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/treseiscinco.apk
      - name: Verify official 365 icon is packaged in the APK
        run: |
          apk="dist/treseiscinco.apk"
          test -s "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging" | grep -q "application-label:'treseiscinco'"
          unzip -Z1 "$apk" | grep -Eq 'res/mipmap-mdpi(-v4)?/ic_launcher.png'
          unzip -Z1 "$apk" | grep -Eq 'res/mipmap-xxxhdpi(-v4)?/ic_launcher.png'
          unzip -Z1 "$apk" | grep -Eq 'res/mipmap-anydpi-v26(-v4)?/ic_launcher.xml'
          echo "APK references the treseiscinco launcher icon and includes the generated density/adaptive resources."
      - name: Publish APK for Cloudflare static assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp dist/treseiscinco.apk public/treseiscinco.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/treseiscinco.apk
          if git diff --cached --quiet; then
            echo "The public APK is already up to date."
          else
            git commit -m "chore: publish latest Android APK"
            git push origin HEAD:main
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: treseiscinco-apk
          path: dist/treseiscinco.apk
          if-no-files-found: error
          retention-days: 30
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f561b01677b1330ed1ee95ad482a54d8' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare deploy skipped: configure the repository secret CLOUDFLARE_API_TOKEN to enable automatic production deployments."
            exit 0
          fi
          npx wrangler deploy
