name: Build treseiscinco

on:
  push:
    branches: [main]
    # Updating only the already-built APK must not trigger another Android build.
    paths-ignore:
      - "public/treseiscinco.apk"
  pull_request:
    branches: [main]
  workflow_dispatch:

# APK publication pushes a generated binary back to main. Serialize builds so two
# runs cannot race while updating that file or deploying the Worker.
concurrency:
  group: treseiscinco-build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check Cloudflare Worker syntax
        run: node --check src/worker.js
      - name: Test startup recovery and clean URLs
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify live Android UI and downloadable APK route
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('capacitor.config.json', 'utf8'));
          const app = readFileSync('src/App.jsx', 'utf8');
          const worker = readFileSync('src/worker.js', 'utf8');
          readFileSync('public/offline.html', 'utf8');
          if (config.server?.url !== 'https://treseiscinco.com') {
            throw new Error('The Android APK must load the live production UI from https://treseiscinco.com');
          }
          if (config.server?.cleartext !== false) {
            throw new Error('The Android live URL must use HTTPS only');
          }
          if (!config.server?.allowNavigation?.includes('treseiscinco.com')) {
            throw new Error('The production domain must be permitted in the Android WebView.');
          }
          if (config.server?.errorPath !== 'offline.html') {
            throw new Error('The live Android app must have a local offline fallback.');
          }
          if (app.split('href="/download/apk"').length - 1 < 2) {
            throw new Error('Both public landing and login pages must use the verified APK download route.');
          }
          for (const marker of [
            'u.pathname==="/download/apk"',
            'application/vnd.android.package-archive',
            'attachment; filename="treseiscinco.apk"'
          ]) {
            if (!worker.includes(marker)) throw new Error('Missing APK download safeguard: ' + marker);
          }
          console.log('Verified: live Android UI, offline fallback, and explicit APK download headers.');
          NODE
      - name: Build installable Android APK
        run: |
          # Avoid packaging a previously published APK inside the next APK.
          rm -f dist/treseiscinco.apk
          npx cap add android
          npx cap sync android
          # Capacitor sync can alter Android resources; stamp the official icon after sync.
          npm run android:icons
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$manifest"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$manifest"
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@mipmap/ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@color/treseiscinco_icon_background' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/treseiscinco.apk
      - name: Verify official 365 icon is packaged in the APK
        run: |
          apk="dist/treseiscinco.apk"
          test -s "$apk"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging" | grep -q "application-label:'treseiscinco'" || { echo "ERROR: la APK no informa la etiqueta treseiscinco."; printf '%s\n' "$badging"; exit 1; }

          # For adaptive launchers, aapt may resolve application: icon= to the adaptive XML;
          # verify the real raster artwork and the adaptive XML independently instead.
          entries="$(unzip -Z1 "$apk")"
          icon_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher[.](png|webp)$' | head -n 1 || true)"
          foreground_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher_foreground[.](png|webp)$' | head -n 1 || true)"
          adaptive_xml_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher.xml$' | head -n 1 || true)"

          if [ -z "$icon_entry" ] || [ -z "$foreground_entry" ] || [ -z "$adaptive_xml_entry" ]; then
            echo "ERROR: faltan recursos de icono dentro del APK. Recursos encontrados:"
            printf '%s\n' "$entries" | grep -E 'ic_launcher|mipmap' | head -n 100 || true
            echo "icon_entry=$icon_entry"
            echo "foreground_entry=$foreground_entry"
            echo "adaptive_xml_entry=$adaptive_xml_entry"
            exit 1
          fi

          unzip -p "$apk" "$icon_entry" > /tmp/treseiscinco-launcher.img
          unzip -p "$apk" "$foreground_entry" > /tmp/treseiscinco-foreground.img
          node --input-type=module <<'NODE'
          import sharp from "sharp";

          for (const [file, requireOfficialColors] of [
            ["/tmp/treseiscinco-launcher.img", true],
            ["/tmp/treseiscinco-foreground.img", true],
          ]) {
            const meta = await sharp(file).metadata();
            const { data, info } = await sharp(file).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
            let visible = 0, yellow = 0, teal = 0, blue = 0;

            for (let i = 0; i < data.length; i += info.channels) {
              const r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
              if (a > 32) visible++;
              if (a > 32 && r > 205 && g > 145 && g < 235 && b < 115) yellow++;
              if (a > 32 && g > 100 && g > r * 1.12 && g > b * 0.92) teal++;
              if (a > 32 && b > 75 && b > r * 1.18 && b > g * 1.02) blue++;
            }

            const report = { file, width: meta.width, height: meta.height, format: meta.format, visible, yellow, teal, blue };
            console.log("APK_ICON_DIAGNOSTIC", JSON.stringify(report));

            if (!meta.width || !meta.height || meta.width < 48 || meta.height < 48 || visible < 300) {
              throw new Error("El icono de la APK está vacío o tiene dimensiones inválidas: " + file);
            }
            if (requireOfficialColors && (yellow < 20 || teal < 20 || blue < 20)) {
              throw new Error("El icono empaquetado no contiene los tres colores de marca 365: " + JSON.stringify(report));
            }
          }
          NODE
          echo "APK label, actual PNG payloads verified; adaptive foreground artwork and adaptive XML verified."
      - name: Publish APK for Cloudflare static assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp dist/treseiscinco.apk public/treseiscinco.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/treseiscinco.apk
          if git diff --cached --quiet; then
            echo "The public APK is already up to date."
          else
            git commit -m "chore: publish latest Android APK"
            git push origin HEAD:main
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: treseiscinco-apk
          path: dist/treseiscinco.apk
          if-no-files-found: error
          retention-days: 30
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f561b01677b1330ed1ee95ad482a54d8' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare deploy skipped: configure the repository secret CLOUDFLARE_API_TOKEN to enable automatic production deployments."
            exit 0
          fi
          npx wrangler deploy
      - name: Verify downloadable APK in production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          url="https://treseiscinco.com/download/apk"
          headers="/tmp/treseiscinco-apk-headers.txt"
          apk="/tmp/treseiscinco-downloaded.apk"
          # Cloudflare Workers Builds can finish a little after GitHub publishes the APK commit.
          # Poll the real public endpoint until it serves the APK attachment rather than cached HTML.
          for attempt in $(seq 1 12); do
            rm -f "$headers" "$apk"
            if curl -sS --connect-timeout 5 --max-time 10 --location -D "$headers" -o "$apk" "$url"; then
              if grep -Eiq '^content-type:[[:space:]]*application/vnd.android.package-archive' "$headers" \
                && grep -Eiq '^content-disposition:[[:space:]]*attachment;[[:space:]]*filename="treseiscinco.apk"' "$headers" \
                && test -s "$apk" \
                && unzip -t "$apk" >/dev/null 2>&1; then
                echo "Verified: production APK endpoint sends a valid APK attachment (attempt $attempt)."
                exit 0
              fi
            fi
            echo "Production APK endpoint is not ready or did not return a valid attachment (attempt $attempt/12); retrying in 5 seconds." >&2
            sleep 5
          done
          echo "ERROR: production APK route never returned a valid APK attachment." >&2
          echo "--- Response headers from the last attempt ---" >&2
          cat "$headers" 2>/dev/null || true
          exit 1

