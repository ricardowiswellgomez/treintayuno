name: Build treseiscinco

on:
  push:
    branches: [main]
    # Updating only the already-built APK must not trigger another Android build.
    paths-ignore:
      - "public/treseiscinco.apk"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-fund
      - name: Audit dependencies for high-severity vulnerabilities
        run: npm audit --audit-level=high
      - name: Check Cloudflare Worker syntax
        run: node --check src/worker.js
      - name: Test startup recovery and clean URLs
        run: npm test
      - name: Build production bundle
        run: npm run build
      - name: Set up Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build installable Android APK
        run: |
          # Avoid packaging a previously published APK inside the next APK.
          rm -f dist/treseiscinco.apk
          npx cap add android
          npx cap sync android
          # Capacitor sync can alter Android resources; stamp the official icon after sync.
          npm run android:icons
          manifest="android/app/src/main/AndroidManifest.xml"
          grep -q 'android:icon="@mipmap/ic_launcher"' "$manifest"
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' "$manifest"
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@mipmap/ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q '@color/treseiscinco_icon_background' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/treseiscinco.apk
      - name: Verify official 365 icon is packaged in the APK
        run: |
          apk="dist/treseiscinco.apk"
          test -s "$apk"
          set -x
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk")"
          printf '%s\n' "$badging" | grep -q "application-label:'treseiscinco'" || { echo "ERROR: la APK no informa la etiqueta treseiscinco."; printf '%s\n' "$badging"; exit 1; }
          # Android may package PNG resources as WebP after resource crunching; verify actual assets below.
          printf '%s\n' "$badging" | grep -Eq "application:.*icon='res/[^']*/ic_launcher[.](png|webp)'" || { echo "ERROR: Android no expone un recurso raster de icono en la APK."; printf '%s\n' "$badging"; exit 1; }
          entries="$(unzip -Z1 "$apk")"
          icon_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher[.](png|webp)
          foreground_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher_foreground[.](png|webp)
          adaptive_xml_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher.xml$' | head -n 1 || true)"
          if [ -z "$icon_entry" ] || [ -z "$foreground_entry" ] || [ -z "$adaptive_xml_entry" ]; then
            echo "ERROR: faltan recursos de icono dentro del APK. Recursos encontrados:"
            printf '%s\n' "$entries" | grep -E 'ic_launcher|mipmap' | head -n 100 || true
            echo "icon_entry=$icon_entry"
            echo "foreground_entry=$foreground_entry"
            echo "adaptive_xml_entry=$adaptive_xml_entry"
            exit 1
          fi
          unzip -p "$apk" "$icon_entry" > /tmp/treseiscinco-launcher.png
          unzip -p "$apk" "$foreground_entry" > /tmp/treseiscinco-foreground.png
          node --input-type=module -e '
            import sharp from "sharp";
            for (const file of ["/tmp/treseiscinco-launcher.png", "/tmp/treseiscinco-foreground.png"]) {
              const meta = await sharp(file).metadata();
              const { data, info } = await sharp(file).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
              let visible = 0;
              for (let i = 3; i < data.length; i += info.channels) if (data[i] > 32) visible++;
              console.log("APK_ICON_DIAGNOSTIC", JSON.stringify({ file, width: meta.width, height: meta.height, format: meta.format, visible }));
              if (!meta.width || !meta.height || meta.width < 48 || meta.height < 48 || visible < 300) {
                throw new Error("El PNG del icono del APK no es válido o está vacío: " + file);
              }
            }
          '
          echo "APK label, icon manifest reference, adaptive icon mapping, and actual PNG payloads verified."
      - name: Publish APK for Cloudflare static assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          cp dist/treseiscinco.apk public/treseiscinco.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/treseiscinco.apk
          if git diff --cached --quiet; then
            echo "The public APK is already up to date."
          else
            git commit -m "chore: publish latest Android APK"
            git push origin HEAD:main
          fi
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: treseiscinco-apk
          path: dist/treseiscinco.apk
          if-no-files-found: error
          retention-days: 30
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy to Cloudflare Workers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'f561b01677b1330ed1ee95ad482a54d8' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Cloudflare deploy skipped: configure the repository secret CLOUDFLARE_API_TOKEN to enable automatic production deployments."
            exit 0
          fi
          npx wrangler deploy
 | head -n 1 || true)"
          foreground_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher_foreground.png$' | head -n 1 || true)"
          adaptive_xml_entry="$(printf '%s\n' "$entries" | grep -E 'res/[^[:space:]]*/ic_launcher.xml$' | head -n 1 || true)"
